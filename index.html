<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leonardo vs Mostri</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;text-shadow:0 2px 4px #000}
  #dmgnum{position:absolute;left:calc(50% + 18px);top:calc(50% - 34px);font-weight:bold;font-size:20px;opacity:0;transition:opacity .4s}
  #cross{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-10px;border:2px solid #fff;border-radius:50%;opacity:.85}
  #hp{position:absolute;left:20px;bottom:20px;width:240px;background:#0008;border:2px solid #fff}
  #shbar{height:8px;width:0;background:#3aa0ff;transition:width .1s}
  #hpbar{height:14px;width:100%;background:#3c3;transition:width .1s}
  #stbar{height:5px;width:100%;background:#ffd23a}
  #stbar.tired{background:#c86a2a}
  #use{position:absolute;left:50%;top:58%;transform:translateX(-50%);display:none;text-align:center;font-weight:bold}
  #usebg{width:200px;height:8px;background:#0008;border:1px solid #fff;margin-top:4px}
  #usebar{height:100%;width:0;background:#3aa0ff}
  #weapon{position:absolute;right:20px;bottom:92px;font-size:22px;text-align:right}
  #info{position:absolute;left:20px;top:16px;font-size:18px}
  #slots{position:absolute;right:20px;bottom:20px;display:flex;gap:6px}
  .slot{position:relative;width:86px;height:62px;box-sizing:border-box;background:#0009;border:2px solid #fff5;border-radius:6px;font-size:13px;line-height:1.3;text-align:center;padding-top:3px}
  .slot b{font-size:15px}
  .slot.on{border:3px solid #fff;transform:translateY(-8px);box-shadow:0 0 10px #fff8}
  .slot.empty{opacity:.35}
  #slots.off{opacity:.4}
  .touch #slots{left:20px;top:76px;right:auto;bottom:auto}
  .touch .slot.on{transform:none}
  .slot i{position:absolute;left:0;bottom:0;width:100%;background:#000b}
  .slot.spec{border-style:dashed;border-color:#d080ff}
  .touch .slot{width:52px;height:46px;font-size:11px;padding-top:1px}
  .touch .slot b{font-size:10px}
  #prog{position:absolute;left:50%;top:16px;width:min(300px,40vw);transform:translateX(-50%);height:10px;background:#0008;border:1px solid #fff}
  #progbar{height:100%;width:0;background:#4f4}
  #boss{position:absolute;left:50%;top:34px;width:min(500px,70vw);transform:translateX(-50%);display:none;text-align:center;font-weight:bold;color:#f66}
  #bossbg{height:14px;background:#0008;border:2px solid #f66;margin-top:2px}
  #bossbar{height:100%;width:100%;background:#d22}
  #form{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:22px;font-weight:bold}
  #msg{position:absolute;left:50%;top:28%;transform:translateX(-50%);font-size:clamp(18px,4vw,30px);font-weight:bold;text-align:center;width:90vw}
  #hint{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);font-size:20px}
  #hit{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(transparent 45%,#f00a);opacity:0;pointer-events:none;transition:opacity .25s}
  #touch{position:fixed;top:0;left:0;right:0;bottom:0;display:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #touch .b{position:absolute;border-radius:50%;background:#fff3;border:2px solid #fff8;color:#fff;font:bold 13px system-ui;display:flex;align-items:center;justify-content:center}
  #bFire{right:24px;bottom:30px;width:96px;height:96px;background:#f445!important}
  #bJump{right:136px;bottom:20px;width:66px;height:66px}
  #bUse{right:140px;bottom:100px;width:58px;height:58px}
  #bSwap{right:42px;bottom:142px;width:58px;height:58px}
  #bBag{right:140px;bottom:170px;width:58px;height:58px}
  #bag{position:fixed;top:0;left:0;right:0;bottom:0;display:none;background:#000d;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:12px;box-sizing:border-box;text-align:center}
  #bag h2{margin:0;color:#7f7;font-size:clamp(18px,5vh,30px)}
  #bag small{opacity:.7}
  .bagrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
  #bag .slot{cursor:pointer;width:clamp(52px,10vh,86px);height:clamp(44px,8.5vh,62px)}
  #bag .slot.sel{outline:3px solid #ffd23a;outline-offset:2px}
  #baginfo{min-height:2.6em;max-width:560px}
  #bag button{font:inherit;font-weight:bold;padding:8px 18px;border-radius:8px;border:2px solid #fff8;background:#fff2;color:#fff;cursor:pointer;margin:0 4px}
  #stick{position:absolute;width:120px;height:120px;margin:-62px;border-radius:50%;background:#fff2;border:2px solid #fff6;display:none;pointer-events:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff9}
  .touch #hp{bottom:auto;top:44px;width:150px}
  .touch #weapon{bottom:auto;top:12px;font-size:16px}
  .touch #info{font-size:14px}
  .touch #hint{bottom:auto;top:62%}
  #screen{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000d;text-align:center;cursor:pointer;touch-action:manipulation;padding:16px;box-sizing:border-box}
  #screen h1{font-size:clamp(24px,min(7vw,9vh),52px);color:#7f7;margin:0 0 1vh}
  #screen p{font-size:clamp(12px,min(2.5vw,3.6vh),18px);line-height:1.6;max-width:680px;margin:0}
  #screen b{color:#ffa030}
</style>
</head>
<body>
<div id="hud">
  <div id="cross"></div>
  <div id="dmgnum"></div>
  <div id="info"></div>
  <div id="slots"></div>
  <div id="prog"><div id="progbar"></div></div>
  <div id="boss">REGINA ALIENA<div id="bossbg"><div id="bossbar"></div></div></div>
  <div id="form"></div>
  <div id="msg"></div>
  <div id="hint"></div>
  <div id="use"><span id="usetxt"></span><div id="usebg"><div id="usebar"></div></div></div>
  <div id="hp"><div id="shbar"></div><div id="hpbar"></div><div id="stbar"></div></div>
  <div id="weapon"></div>
</div>
<div id="hit"></div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="b" id="bFire" data-b="fire">SPARA</div>
  <div class="b" id="bJump" data-b="jump">SALTA</div>
  <div class="b" id="bUse" data-b="use">APRI</div>
  <div class="b" id="bSwap" data-b="swap">ARMA</div>
  <div class="b" id="bBag" data-b="bag">ZAINO</div>
</div>
<div id="bag">
  <h2>🎒 ZAINO</h2>
  <small>Tocca un oggetto, poi un'altra casella per spostarlo</small>
  <div>Barra armi (1-5) + slot magico (6)</div><div class="bagrow" id="bagbar"></div>
  <div>Zaino</div><div class="bagrow" id="bagpack"></div>
  <div id="baginfo"></div>
  <div><button id="bagdrop">Butta</button><button id="bagclose">Chiudi</button></div>
</div>
<div id="screen">
  <h1 id="title">LEONARDO VS MOSTRI</h1>
  <p id="sub"></p>
</div>

<script>
  // se il gioco non parte (browser troppo vecchio, niente WebGL o rete assente) mostra un messaggio invece di restare fermo
  setTimeout(function () {
    if (window.gameReady) return;
    document.getElementById('sub').innerHTML = 'Il gioco non riesce a partire su questo browser.<br>Controlla la connessione, poi aggiorna il browser o prova con Chrome, Safari, Firefox o Edge recenti.';
  }, 15000);
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = id => document.getElementById(id);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = THREE.MathUtils.clamp;
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) { document.body.classList.add('touch'); $('touch').style.display = 'block'; }

// ---------- livelli: ognuno più difficile del precedente (mul = moltiplicatore di vita, danno, velocità) ----------
const LEVELS = [
  { name: 'GIUNGLA ALIENA', sky: 0x2a4a2a, ground: 0x2f5a22, enemy: 'alien', foes: 'Alieni', boss: 'REGINA ALIENA', bossHp: 15000, blood: 0x66ff33, spit: 0x99ff22, mul: 1 },
  { name: 'DESERTO DEGLI ZOMBI', sky: 0xb89a6a, ground: 0xd2b47a, enemy: 'zombie', foes: 'Zombi', boss: 'RE DEGLI ZOMBI', bossHp: 22000, blood: 0x8a1010, spit: 0x7a9a30, mul: 1.4 },
  { name: 'CITTÀ DEGLI ORCHI', sky: 0x4a4a5a, ground: 0x505058, enemy: 'orc', foes: 'Orchi', boss: 'ORCO SUPREMO', bossHp: 30000, blood: 0x30a030, spit: 0x888888, mul: 1.8 },
  // livello segreto: si sblocca uccidendo 100 orchi e l'Orco Supremo; gravità bassa
  { name: 'SPAZIO PROFONDO', sky: 0x05040f, ground: 0x3a3450, enemy: 'sdragon', foes: 'Draghi', boss: 'IL SIGNORE OSCURO', bossHp: 40000, blood: 0xff44ff, spit: 0xaa33ff, mul: 2.2, grav: 0.45 },
];
// shortcut: il livello passa via URL e ricarica la pagina, quindi armi e vita ripartono da zero a ogni livello
const ORC_GOAL = 100, CITY = 2;
const LV = clamp(parseInt(new URLSearchParams(location.search).get('livello')) || 1, 1, LEVELS.length) - 1;
const CFG = LEVELS[LV];
$('title').textContent = 'LEONARDO VS MOSTRI';
$('boss').firstChild.textContent = CFG.boss;

$('sub').innerHTML =
  `🎯 <b>Livello ${LV + 1}: ${CFG.name}</b> · Aiuta <b>Leonardo</b> ad attraversare il percorso, sconfiggi <b>${CFG.boss}</b> e raggiungi l'<b>USCITA</b>.<br>`
  + (LV === CITY ? `🔓 Uccidi <b>${ORC_GOAL} orchi</b> e l'Orco Supremo per sbloccare il <b>livello segreto</b>!<br>` : '')
  + (CFG.grav ? '🍫 Nello spazio hai il <b>Lancia-Cioccolato</b> · gravità bassa: salti altissimi!<br>' : '')
  + (isTouch
    ? '🎮 Joystick a sinistra · trascina a destra per mirare · SPARA · SALTA · APRI · ARMA o tocca gli slot · ZAINO<br>'
    : '🎮 WASD muovi · Mouse mira · Click spara · Shift corri (stamina) · Spazio salta · E apri · 1-6, Q o rotella armi · Tab zaino<br>')
  + '🔫 Armi per rarità: <span style="color:#9a9a9a">comune</span> · <span style="color:#3cb043">non comune</span> · <span style="color:#2f80ed">rara</span> · <span style="color:#a040e0">epica</span> · <span style="color:#f08020">leggendaria</span> · <span style="color:#ffd700">mitica</span> · 🎯 colpo in testa = danno doppio<br>'
  + '🩹 Consumabili: Bende, Kit medico, Pozioni scudo (selezionali e premi spara) · 👀 i mostri ti inseguono solo se ti avvicini<br>'
  + '✨ <b>Casse magiche viola</b>: poteri di Fuoco, Acqua, Terra, Fulmine, Onda Energetica (tieni premuto) e, rarissima, la 🌕 <b>Sfera Suprema</b> · slot 6<br>'
  + '🐉 Ogni 2 casse una trasformazione per 20s: <b>DRAGO DI FUOCO</b> 🔥, <b>LUPO FOLGORE</b> ⚡, <b>SERPENTE DELLE TEMPESTE</b> 🌪️, <b>MAGO DELL\'INFINITO</b> 🔮 (Q cambia tecnica), uccidono in un colpo<br><br><b>'
  + (isTouch ? 'Tocca per giocare' : 'Clicca per giocare') + '</b>';

// ---------- audio (sintetizzato, nessun file) ----------
let AC = null, noiseBuf = null;
function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return AC;
}
function snd(type, f1, f2, dur, vol) {
  if (!AC) return;
  const t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let src;
  if (type === 'noise') {
    src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    src.connect(f); f.connect(g);
  } else {
    src = AC.createOscillator(); src.type = type;
    src.frequency.setValueAtTime(f1, t); src.frequency.exponentialRampToValueAtTime(f2, t + dur);
    src.connect(g);
  }
  g.connect(AC.destination); src.start(t); src.stop(t + dur);
}
const seq = (notes, type, gap) => notes.forEach((f, i) => setTimeout(() => snd(type, f, f, gap / 1000 + 0.05, 0.15), i * gap));
const SFX = {
  rifle: () => snd('noise', 3000, 300, 0.08, 0.25),
  shotgun: () => { snd('noise', 2000, 100, 0.3, 0.5); snd('square', 120, 40, 0.15, 0.2); },
  minigun: () => snd('noise', 4000, 500, 0.04, 0.15),
  rocket: () => snd('sawtooth', 200, 60, 0.4, 0.2),
  laser: () => snd('sawtooth', 1800, 200, 0.25, 0.15),
  plasma: () => snd('square', 900, 300, 0.07, 0.12),
  railgun: () => { snd('sawtooth', 3000, 100, 0.5, 0.25); snd('noise', 8000, 500, 0.3, 0.3); },
  nuke: () => { snd('sine', 60, 20, 2.5, 0.8); snd('noise', 800, 30, 2.5, 0.7); },
  boom: () => { snd('noise', 1200, 40, 0.8, 0.6); snd('sine', 90, 30, 0.6, 0.5); },
  fire: () => snd('noise', 900, 250, 0.18, 0.18),
  choco: () => { snd('square', 520, 260, 0.08, 0.1); snd('noise', 2500, 600, 0.06, 0.12); },
  head: () => snd('square', 1400, 1800, 0.08, 0.12),
  fireball: () => { snd('noise', 600, 2500, 0.4, 0.3); snd('sawtooth', 200, 90, 0.4, 0.15); },
  wave: () => { snd('noise', 400, 1600, 1.2, 0.4); snd('sine', 90, 140, 1.2, 0.2); },
  quake: () => { snd('sine', 55, 25, 1.4, 0.8); snd('noise', 300, 40, 1.4, 0.6); },
  charge: () => snd('sine', 300 + charge * 500, 320 + charge * 500, 0.22, 0.1),
  blast: () => { snd('sawtooth', 140, 60, 1.2, 0.35); snd('noise', 3000, 200, 1.2, 0.4); },
  wind: () => { snd('noise', 300, 1800, 0.7, 0.35); snd('sine', 120, 260, 0.7, 0.1); },
  zap: () => { snd('sawtooth', 2500, 80, 0.2, 0.2); snd('noise', 6000, 1000, 0.15, 0.25); },
  die: () => snd('square', 500, 60, 0.25, 0.1),
  hurt: () => snd('sawtooth', 220, 90, 0.2, 0.25),
  pick: () => seq([600, 900], 'square', 80),
  crate: () => snd('noise', 600, 150, 0.3, 0.35),
  transform: () => { snd('sawtooth', 100, 800, 0.8, 0.2); snd('sine', 200, 1600, 0.8, 0.2); },
  roar: () => { snd('sawtooth', 90, 40, 1.5, 0.4); snd('noise', 500, 80, 1.5, 0.3); },
  spit: () => snd('sine', 300, 900, 0.2, 0.15),
  win: () => seq([523, 659, 784, 1047], 'square', 150),
  lose: () => seq([400, 300, 200, 120], 'sawtooth', 220),
};

// ---------- scena ----------
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(isTouch ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(CFG.sky);
scene.fog = new THREE.Fog(CFG.sky, 15, 90);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
// controllato a ogni frame: su telefono l'evento resize alla rotazione arriva con misure vecchie
function fit() {
  const w = innerWidth, h = innerHeight, c = renderer.domElement;
  if (c.clientWidth === w && c.clientHeight === h) return;
  camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
scene.add(new THREE.HemisphereLight(LV ? 0xffffff : 0xcfffcf, LV ? 0x554433 : 0x223311, 1.3)); // luce verdognola solo nella giungla
const sun = new THREE.DirectionalLight(0xffffee, 1.2); sun.position.set(30, 50, 10); scene.add(sun);

const M = (color, emissive = 0) => new THREE.MeshLambertMaterial({ color, emissive });
const B = color => new THREE.MeshBasicMaterial({ color });
const mesh = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };

const LEN = 400, W = 60; // il percorso va da z=0 a z=-LEN; il boss è vicino a z=-LEN

const ground = mesh(new THREE.PlaneGeometry(W * 2 + 60, LEN + 100), M(CFG.ground), 0, 0, -LEN / 2);
ground.rotation.x = -Math.PI / 2; scene.add(ground);

const crateSpots = [], gunSpots = [];
for (let i = 0; i < 24; i++) crateSpots.push(V(rnd(-35, 35), 0, -12 - i * 15 + rnd(-5, 5)));
const magicSpots = []; for (let i = 0; i < 7; i++) magicSpots.push(V(rnd(-40, 40), 0, -30 - i * 48 + rnd(-8, 8)));
for (let i = 0; i < 12; i++) gunSpots.push(V(rnd(-20, 20), 0, -25 - i * 28 + rnd(-8, 8)));
const freeSpots = [...crateSpots, ...magicSpots, ...gunSpots, V(0, 0, 0)];

// ostacoli del livello, tutti con collisione a cerchio {x, z, r}
const trees = [], o = new THREE.Object3D(), col = new THREE.Color();
let skyDome = null;
// libero dalla radura del boss, da casse e armi
const okSpot = (x, z, pad) => Math.hypot(x, z + LEN) > 24 + pad && !freeSpots.some(s => Math.hypot(s.x - x, s.z - z) < 4 + pad);
const deco = (geo, color, n, place) => {
  const im = new THREE.InstancedMesh(geo, M(color), n);
  for (let i = 0; i < n; i++) { o.rotation.set(0, 0, 0); place(i); o.updateMatrix(); im.setMatrixAt(i, o.matrix); }
  scene.add(im); return im;
};
if (CFG.enemy === 'alien') buildJungle();
else if (CFG.enemy === 'zombie') buildDesert();
else if (CFG.enemy === 'orc') buildCity();
else buildSpace();
// griglia per le collisioni: ogni cella da 8 m conosce gli ostacoli abbastanza vicini da toccarla
const CELL = 8, grid = new Map();
for (const t of trees) {
  const reach = Math.ceil((t.r + 3) / CELL), cx = Math.floor(t.x / CELL), cz = Math.floor(t.z / CELL);
  for (let i = -reach; i <= reach; i++) for (let j = -reach; j <= reach; j++) {
    const k = (cx + i) + ',' + (cz + j);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(t);
  }
}

function buildSpace() {
  while (trees.length < 220) {
    const x = rnd(-W, W), z = rnd(-LEN - 30, 20), rock = Math.random() < 0.5;
    if (okSpot(x, z, 0)) trees.push(rock ? { x, z, r: rnd(1, 2.8), rock } : { x, z, r: rnd(0.5, 1), h: rnd(2, 6) });
  }
  const crys = trees.filter(t => !t.rock), rocks = trees.filter(t => t.rock);
  deco(new THREE.ConeGeometry(1, 1, 5).translate(0, 0.5, 0), 0x66ccff, crys.length, i => {
    const t = crys[i]; o.position.set(t.x, 0, t.z); o.scale.set(t.r, t.h, t.r); o.rotation.set(rnd(-0.2, 0.2), rnd(0, 3), rnd(-0.2, 0.2));
  }).material.emissive.setHex(0x113355); // cristalli che brillano
  deco(new THREE.DodecahedronGeometry(1, 0), 0x6a6478, rocks.length, i => {
    const t = rocks[i]; o.position.set(t.x, t.r * 0.3, t.z); o.scale.set(t.r, t.r * 0.6, t.r); o.rotation.set(rnd(0, 3), rnd(0, 3), 0);
  });
  deco(new THREE.TorusGeometry(1, 0.25, 4, 16).rotateX(Math.PI / 2), 0x2a2438, 120, () => { // crateri
    o.position.set(rnd(-W, W), 0, rnd(-LEN - 30, 20)); o.scale.setScalar(rnd(2, 6));
  });
  const pts = []; // stelle
  for (let i = 0; i < 1500; i++) pts.push(V(rnd(-1, 1), rnd(0, 1), rnd(-1, 1)).normalize().multiplyScalar(250));
  const stars = new THREE.Points(new THREE.BufferGeometry().setFromPoints(pts), new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, fog: false }));
  const planet = mesh(new THREE.SphereGeometry(30, 32, 16), new THREE.MeshBasicMaterial({ color: 0x3a7ad0, fog: false }), -120, 90, -180);
  skyDome = new THREE.Group(); skyDome.add(stars, planet); scene.add(skyDome); // segue il giocatore
  scene.fog.near = 30; scene.fog.far = 140;
}

function buildDesert() {
  while (trees.length < 260) {
    const x = rnd(-W, W), z = rnd(-LEN - 30, 20), rock = Math.random() < 0.4;
    if (okSpot(x, z, 0)) trees.push(rock ? { x, z, r: rnd(1, 2.5), rock } : { x, z, r: rnd(0.35, 0.55), h: rnd(2.5, 5) });
  }
  const cacti = trees.filter(t => !t.rock), rocks = trees.filter(t => t.rock);
  deco(new THREE.CylinderGeometry(1, 1, 1, 8).translate(0, 0.5, 0), 0x4a8a3a, cacti.length * 3, i => {
    const t = cacti[Math.floor(i / 3)], k = i % 3; // tronco + due braccia
    if (!k) { o.position.set(t.x, 0, t.z); o.scale.set(t.r, t.h, t.r); }

function collide(p, rad) {
  for (const t of grid.get(Math.floor(p.x / CELL) + ',' + Math.floor(p.z / CELL)) || []) {
    const dx = p.x - t.x, dz = p.z - t.z;
    if (Math.abs(dz) > t.r + 3 || Math.abs(dx) > t.r + 3) continue;
    const d = Math.hypot(dx, dz), m = t.r + rad;
    if (d < m && d > 1e-4) { p.x = t.x + dx / d * m; p.z = t.z + dz / d * m; }
  }
  p.x = clamp(p.x, -W, W); p.z = clamp(p.z, -LEN - 40, 18);
}

const partG = new THREE.SphereGeometry(1, 6, 4);
const partPool = [], MAX_PARTS = isTouch ? 220 : 450; // shortcut: oltre il tetto le particelle in più si scartano
function particle(pos, vel, color, life, size, grow = 0) {
  if (parts.length >= MAX_PARTS) return;
  const m = partPool.pop() || new THREE.Mesh(partG, new THREE.MeshBasicMaterial({ transparent: true })); // riusa le particelle finite
  m.material.color.setHex(color); m.material.opacity = 1; m.position.copy(pos); m.scale.setScalar(size); scene.add(m);
  parts.push({ m, vel, life, max: life, size, grow });
}
function burst(pos, color, n, speed) {
  for (let i = 0; i < n; i++) particle(pos, V(rnd(-1, 1), rnd(0, 1.5), rnd(-1, 1)).multiplyScalar(speed), color, rnd(0.3, 0.7), rnd(0.08, 0.2));
}
function line(pts, color, life) {
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color }));
  scene.add(l); lines.push({ o: l, life });
}
function bolt(a, b) {
  const pts = [];
  for (let i = 0; i <= 8; i++) {
    const p = a.clone().lerp(b, i / 8);
    if (i && i < 8) p.add(V(rnd(-0.7, 0.7), rnd(-0.7, 0.7), rnd(-0.7, 0.7)));
    pts.push(p);
  }
  line(pts, 0xaaffff, 0.15);
}

}
function explode(p, r, d, quiet) {
  burst(p, r > 10 ? 0xffee44 : 0xff8822, Math.min(120, r * 6), r * 1.7);
  if (!quiet) SFX.boom();

}
function hurt(d) {

}

// mira assistita su telefono: l'alieno più vicino entro ~8° dal mirino
function assist(r) {
  let best = null, bd = 60;
  for (const e of enemies) {
    const v = chest(e).sub(r.origin), d = v.length();
    if (d < bd && v.normalize().dot(r.direction) > 0.99) { bd = d; best = e; }
  }
  return best;
}

function shoot() {
  const w = WEAPONS[cur];
  const muzzle = man.userData.gun.localToWorld(V(0, 0, -0.55));
  if (w.proj) { launchBar(muzzle); SFX.choco(); return; } // munizioni infinite
  for (let i = 0; i < w.pellets; i++) {
    ray.setFromCamera(new THREE.Vector2(rnd(-w.spread, w.spread), rnd(-w.spread, w.spread)), camera);
    const hits = ray.intersectObjects([ground, ...enemies], true);
    let endP = ray.ray.at(90, V());
    if (w.pierce) {
      const seen = new Set();
      for (const h of hits) { const e = h.object.userData.root; if (!e || seen.has(e)) continue; seen.add(e); hitEnemy(e, w.dmg, h.object.userData.head); }
    } else {
      let e = hits[0]?.object.userData.root; const head = hits[0]?.object.userData.head;
      if (!e && isTouch && (e = assist(ray.ray))) endP = chest(e);
      else if (hits.length) endP = hits[0].point;
      if (w.splash && (e || hits.length)) explode(endP, w.splash, w.dmg, cur === 'plasma');
      else if (e) { hitEnemy(e, w.dmg, head); burst(endP, 0x88ff44, 3, 3); }
    }
    line([muzzle, endP], w.color, w.pierce ? 0.15 : 0.05);
  }
  SFX[cur]();
  spend();
}
function spend() {

// ---------- poteri magici ----------
const fx = []; // effetti temporanei: { o, life, max, tick(dt, k, f) }
function addFx(o, life, tick) { scene.add(o); fx.push({ o, life, max: life, tick }); }
function updateFx(dt) {
  for (const f of [...fx]) {
    f.life -= dt; f.tick?.(dt, 1 - f.life / f.max, f);
    if (f.life <= 0) { // gli effetti usano geometrie e materiali propri: liberali
      scene.remove(f.o); fx.splice(fx.indexOf(f), 1);
      f.o.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
    }
  }
}
// punto sotto il mirino (terreno o nemico), ignorando ciò che sta tra telecamera e Leonardo
function aimPoint(len) {
  ray.setFromCamera(new THREE.Vector2(0, 0), camera);
  const minD = camera.position.distanceTo(P);
  const hit = ray.intersectObjects([ground, ...enemies], true).find(h => h.distance > minD);
  return hit ? hit.point : ray.ray.at(len, V());
}
const fadeMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide });
function castMagic(k) {
  const w = WEAPONS[k], f = V(-Math.sin(yaw), 0, -Math.cos(yaw)), hand = man.userData.gun.localToWorld(V(0, 0, -0.6));
  magicCd = w.cd;

  if (k === 'fuoco') { // palla di fuoco
    const dir = aimPoint(80).sub(hand).normalize(), ball = mesh(new THREE.SphereGeometry(0.5, 12, 8), B(0xff7a22), hand.x, hand.y, hand.z);
    SFX.fireball();
    addFx(ball, 2.5, (dt, _, fb) => {
      const p = ball.position; p.addScaledVector(dir, 38 * dt);
      particle(p, V(rnd(-1, 1), rnd(0, 1), rnd(-1, 1)), [0xff4400, 0xffaa22][Math.floor(rnd(0, 2))], 0.35, 0.25, 1);
      const e = enemies.find(e => Math.hypot(e.position.x - p.x, e.position.z - p.z) < e.userData.rad + 0.7 && p.y < e.position.y + 2.6 * e.scale.y);
      if (e || p.y < 0.2 || fb.life <= 0.02) { explode(p, 5, w.dmg); fb.life = 0; }
    });
  } else if (k === 'acqua') { // muro d'acqua che avanza

        if (!hit.has(e)) { hit.add(e); damage(e, w.dmg); }
        if (!e.userData.boss) e.position.addScaledVector(f, 22 * dt); // trascinati dall'onda
      }
      if (Math.random() < 0.6) particle(wall.position.clone().add(V(rnd(-5, 5), 3.5, 0)), V(0, 2, 0), 0xe0f4ff, 0.4, 0.2);
    });
  } else if (k === 'terra') { // terremoto intorno a Leonardo
    const ring = mesh(new THREE.TorusGeometry(1, 0.3, 6, 32).rotateX(Math.PI / 2), fadeMat(0x9a7a4a, 0.8), P.x, 0.3, P.z);
    addFx(ring, 0.7, (dt, k) => { ring.scale.setScalar(1 + k * 13); ring.material.opacity = 0.8 * (1 - k); });
    for (let i = 0; i < 14; i++) { // spuntoni di roccia
      const a = i / 14 * Math.PI * 2, r = rnd(4, 10), sp = mesh(new THREE.ConeGeometry(0.6, 2.5, 5), M(0x7a6a5a), P.x + Math.cos(a) * r, -1.2, P.z + Math.sin(a) * r);
      addFx(sp, 1.6, (dt, k) => { sp.position.y = k < 0.2 ? -1.2 + k * 10 : k > 0.75 ? 0.8 - (k - 0.75) * 8 : 0.8; });
    }
    for (const e of [...enemies]) {
      const dx = e.position.x - P.x, dz = e.position.z - P.z, d = Math.hypot(dx, dz) || 1;
      if (d > 13 + (e.userData.boss ? e.userData.rad : 0)) continue;
      e.userData.rooted = e.userData.boss ? 1 : 3;
      if (!e.userData.boss) { e.position.x += dx / d * 6; e.position.z += dz / d * 6; }

    }
    burst(P.clone().setY(0.5), 0x9a7a4a, 50, 10); shake = 0.6; SFX.quake();
  } else if (k === 'sfera') { // sfera gigante: cresce sopra Leonardo, poi cade sul punto mirato
    let t = aimPoint(80); t.y = 0;
    if (Math.hypot(t.x - P.x, t.z - P.z) > 40) t = P.clone().add(V(-Math.sin(yaw) * 35, 0, -Math.cos(yaw) * 35)).setY(0); // mira all'orizzonte: cade a 35 m

        g.position.copy(P).add(V(0, 10 + k * 8, 0)); g.scale.setScalar(0.5 + k / 0.6 * 7);
        for (let i = 0; i < 3; i++) { const a = V(rnd(-1, 1), rnd(-0.6, 1), rnd(-1, 1)).normalize().multiplyScalar(25), from = g.position.clone().add(a);
          particle(from, a.multiplyScalar(-1.6), 0xcff4ff, 0.6, 0.15); }
        if ((sndT -= dt) <= 0) { SFX.charge(); sndT = 0.25; }
      } else { // lancio
        f.from = f.from || g.position.clone();

  const unlocked = LV === CITY && orcs >= ORC_GOAL; // livello segreto nello spazio
  state = !win ? 'over' : LV < CITY || unlocked ? 'next' : 'win'; firing = false;
  win ? SFX.win() : SFX.lose();
  document.exitPointerLock?.();
  $('title').textContent = { over: 'GAME OVER', next: 'LIVELLO COMPLETATO!', win: 'HAI VINTO TUTTI I LIVELLI!' }[state];
  $('title').style.color = win ? '#7f7' : '#f55';
  $('sub').innerHTML = `${CFG.foes} eliminati: <b>${kills}</b> · Casse aperte: <b>${opened}</b><br>`
    + (unlocked ? '🚀 <b>LIVELLO SEGRETO SBLOCCATO!</b><br>' : '')
    + (state === 'next' ? `Prossimo livello: <b>${LEVELS[LV + 1].name}</b> (più difficile!)<br>` : '')
    + (state === 'win' && LV === CITY ? `Hai eliminato ${orcs} orchi: ne servono ${ORC_GOAL} per il livello segreto nello spazio!<br>` : '')
    + `<br><b>${isTouch ? 'Tocca' : 'Clicca'} ${{ over: 'per riprovare', next: 'per continuare', win: 'per ricominciare dal primo livello' }[state]}</b>`;
  $('screen').style.display = 'flex';
}

// ---------- input: tastiera e mouse ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') tryOpen();
  if (e.code === 'Tab' || e.code === 'KeyI') { e.preventDefault(); return state === 'bag' ? closeBag() : openBag(); }
  if (e.code === 'Escape' && state === 'bag') return closeBag();
  if (e.code === 'KeyQ') cycle();
  if (/^Digit[1-6]$/.test(e.code)) pick(+e.code[5] - 1);
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousedown', e => { if (e.button === 0) firing = true; });
addEventListener('mouseup', e => { if (e.button === 0) firing = false; });
addEventListener('wheel', e => { if (state === 'play') cycle(e.deltaY > 0 ? 1 : -1); });
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.0025;
  pitch = clamp(pitch - e.movementY * 0.0025, -0.6, 0.9);
});
$('screen').addEventListener('click', () => {
  if (state === 'over') return location.reload();
  if (state === 'next' || state === 'win') { location.search = '?livello=' + (state === 'next' ? LV + 2 : 1); return; }
  audio().resume();
  state = 'play'; $('screen').style.display = 'none';
  if (isTouch) {
    document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
  } else renderer.domElement.requestPointerLock()?.catch?.(() => {});
});
document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement && state === 'play') {
    state = 'menu'; firing = false;
    $('title').textContent = 'PAUSA'; $('sub').innerHTML = '<b>Clicca per continuare</b>';
    $('screen').style.display = 'flex';
  }
});

// ---------- input: touch ----------
const touchEl = $('touch'), stickEl = $('stick'), knob = $('knob'), roles = new Map();
// Safari ignora user-scalable=no: blocca a mano pinch-zoom e doppio tocco
for (const t of ['gesturestart', 'gesturechange']) document.addEventListener(t, e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
touchEl.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
touchEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  const stickBusy = [...roles.values()].some(r => r.role === 'stick');
  const role = e.target.dataset.b || (e.clientX < innerWidth * 0.45 && !stickBusy ? 'stick' : 'look');
  if (role === 'use') return tryOpen();
  if (role === 'swap') return cycle();
  if (role === 'bag') return openBag();
  const slot = [...document.querySelectorAll('.slot')].find(el => { // tocco su uno slot (l'HUD non riceve eventi)
    const r = el.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  });
  if (slot && !e.target.dataset.b) return pick(+slot.dataset.slot);
  try { touchEl.setPointerCapture(e.pointerId); } catch {} // può fallire se il dito è già stato alzato
  roles.set(e.pointerId, { role, x: e.clientX, y: e.clientY });
  if (role === 'fire') firing = true;
  if (role === 'jump') keys.Space = true;
  if (role === 'stick') { stickEl.style.display = 'block'; stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px'; }
});
touchEl.addEventListener('pointermove', e => {
  const r = roles.get(e.pointerId); if (!r) return;
  if (r.role === 'stick') {
    let dx = e.clientX - r.x, dy = e.clientY - r.y; const l = Math.hypot(dx, dy);
    if (l > 50) { dx *= 50 / l; dy *= 50 / l; }
    joy.x = dx / 50; joy.y = dy / 50; knob.style.transform = `translate(${dx}px,${dy}px)`;
  } else if (r.role === 'look' || r.role === 'fire') {
    yaw -= (e.clientX - r.x) * 0.006;
    pitch = clamp(pitch - (e.clientY - r.y) * 0.006, -0.6, 0.9);
    r.x = e.clientX; r.y = e.clientY;
  }
});
const release = e => {
  const r = roles.get(e.pointerId); if (!r) return;
  roles.delete(e.pointerId);
  if (r.role === 'fire') firing = false;
  if (r.role === 'jump') keys.Space = false;
  if (r.role === 'stick') { joy.x = joy.y = 0; stickEl.style.display = 'none'; knob.style.transform = ''; }
};
touchEl.addEventListener('pointerup', release);
touchEl.addEventListener('pointercancel', release);


// ---------- zaino (stile Fortnite): tocca un oggetto e poi la casella dove spostarlo ----------
let bagSel = -1;
const RAR_NAMES = ['Comune', 'Non comune', 'Rara', 'Epica', 'Leggendaria', 'Mitica'];
function openBag() {
  if (state !== 'play') return;
  state = 'bag'; firing = false; bagSel = -1; useK = null;
  drawBag(); $('bag').style.display = 'flex';
  document.exitPointerLock?.();
}
function closeBag() {
  state = 'play'; $('bag').style.display = 'none'; slotsDrawn = '';
  if (!isTouch) renderer.domElement.requestPointerLock()?.catch?.(() => {});
}
function itemInfo(k) {
  const w = WEAPONS[k], rar = `<span style="color:${RARITY[w.rar]}">${RAR_NAMES[w.rar]}</span>`;
  if (w.magic) return `<b>${w.icon} ${w.name}</b> · ${rar} · ${w.desc} · ricarica ${w.cd}s`;
  if (w.use) return `<b>${w.name}</b> · ${rar} · ${w.heal ? `+${w.heal} salute` : `+${w.shield} scudo`} (fino a ${w.upTo}) · ${w.use}s · hai x${ammo[k]}`;
  return `<b>${w.name}</b> · ${rar} · danno ${w.dmg}${w.pellets > 1 ? ' x' + w.pellets : ''} · munizioni ${ammo[k] === Infinity ? '∞' : ammo[k]}`;
}
function drawBag(msg) {
  const cell = i => slotHtml(slots[i], i, 'cell', false).replace('class="slot', `class="slot${i === bagSel ? ' sel' : ''}`);
  $('bagbar').innerHTML = [0, 1, 2, 3, 4, 5].map(cell).join('');
  $('bagpack').innerHTML = slots.slice(BAG0).map((_, j) => cell(BAG0 + j)).join('');
  $('baginfo').innerHTML = msg || (bagSel >= 0 && slots[bagSel] ? itemInfo(slots[bagSel]) + '<br><small>Ora tocca la casella di destinazione</small>' : 'Seleziona un oggetto');
}
// la magia sta solo nello slot 6 o nello zaino; le altre cose non vanno nello slot 6
const fits = (k, i) => !k || (i === MAGIC_SLOT ? !!WEAPONS[k].magic : !WEAPONS[k].magic || i >= BAG0);
$('bag').addEventListener('click', e => {
  const c = e.target.closest('[data-cell]'); if (!c) return;
  const i = +c.dataset.cell;
  if (bagSel < 0 || bagSel === i) { bagSel = slots[i] && bagSel !== i ? i : -1; return drawBag(); }
  const a = slots[bagSel], b = slots[i];
  if (!fits(a, i) || !fits(b, bagSel)) { bagSel = -1; return drawBag('✨ Lo slot 6 è solo per le magie, e le magie vanno nello slot 6 o nello zaino'); }
  slots[bagSel] = b; slots[i] = a; bagSel = -1;
  const at = slots.indexOf(cur);
  if (at < 0 || at > MAGIC_SLOT) cur = slots.slice(0, HOT + 1).find(Boolean) || 'rifle'; // l'arma in mano è finita nello zaino
  SFX.pick(); drawBag();
});
$('bagdrop').addEventListener('click', () => {
  const k = slots[bagSel];
  if (!k) return drawBag('Seleziona prima un oggetto da buttare');
  if (k === 'rifle') return drawBag("Il fucile d'assalto non si può buttare");
  const f = V(-Math.sin(yaw), 0, -Math.cos(yaw)), n = ammo[k];
  slots[bagSel] = null; delete ammo[k]; bagSel = -1;
  addItem(WEAPONS[k].magic ? 'magic' : WEAPONS[k].use ? 'cons' : 'gun', P.clone().addScaledVector(f, 3), k, WEAPONS[k].magic ? undefined : n);
  if (cur === k) cur = slots.slice(0, HOT + 1).find(Boolean) || 'rifle';
  drawBag(`${WEAPONS[k].name} buttato a terra`);
});
$('bagclose').addEventListener('click', closeBag);

// ---------- loop ----------
const clock = new THREE.Clock();
function update(dt) {
  time += dt;
  if (form !== 'man' && (formT -= dt) <= 0) { setForm('man'); toast('Sei tornato umano'); }

  // movimento
  const f = V(-Math.sin(yaw), 0, -Math.cos(yaw)), r = V(Math.cos(yaw), 0, -Math.sin(yaw));
  const mv = V();
  if (keys.KeyW) mv.add(f); if (keys.KeyS) mv.sub(f);
  if (keys.KeyD) mv.add(r); if (keys.KeyA) mv.sub(r);
  mv.addScaledVector(f, -joy.y).addScaledVector(r, joy.x);
  const mag = Math.min(1, mv.length()), moving = mag > 0.1;
  const wantRun = keys.ShiftLeft || keys.ShiftRight || Math.hypot(joy.x, joy.y) > 0.95;
  const run = wantRun && moving && form === 'man' && !tired;
  if (run) {
    stamina -= 20 * dt; stamRest = 1; // ~5 secondi di corsa
    if (stamina <= 0) { stamina = 0; tired = true; }
  } else if ((stamRest -= dt) <= 0) { // ricarica dopo 1 secondo di pausa
    stamina = Math.min(100, stamina + 18 * dt);
    if (tired && stamina >= 30) tired = false;
  }
  const speed = form === 'dragon' ? 13 : form === 'beast' ? 15 : form === 'serpent' ? 16 : form === 'mage' ? 12 : run ? 11 : 6;
  if (moving) P.add(mv.normalize().multiplyScalar(speed * mag * (useK ? 0.5 : 1) * dt)); // più lento mentre ti curi
  if (form === 'serpent') { P.y += ((keys.Space ? 14 : 7) - P.y) * Math.min(1, dt * 3); vy = 0; } // vola: salta = sali
  else {
    if (keys.Space && P.y === 0) vy = form === 'man' ? 7.5 : 12;
    vy -= (form === 'dragon' ? 18 : 25) * (CFG.grav || 1) * dt; P.y += vy * dt;
    if (P.y <= 0) { P.y = 0; vy = 0; }
  }
  collide(P, form === 'man' ? 0.4 : 1.2);
  if (boss && !bossDead && P.z < -LEN + 3) { P.z = -LEN + 3; if (msgT <= 0) toast(`Sconfiggi ${CFG.boss} per aprire l'uscita!`); }
  player.rotation.y = yaw;
  const sw = moving ? Math.sin(time * (run ? 18 : 12)) * (run ? 0.9 : 0.6) : 0;
  man.userData.legL.rotation.x = sw; man.userData.legR.rotation.x = -sw;
  beast.userData.legs.forEach((l, i) => { l.rotation.x = moving ? Math.sin(time * 16 + i * 1.6) * 0.7 : 0; });
  const flap = Math.sin(time * (moving || P.y > 0 ? 12 : 4)) * 0.45;
  dragon.userData.wR.rotation.z = flap; dragon.userData.wL.rotation.z = -flap;
  dragon.userData.flame.scale.setScalar(1 + Math.sin(time * 20) * 0.2);
  serpent.userData.segs.forEach((s, i) => { s.position.y = 2 + Math.sin(time * 5 - i * 0.7) * 0.35; s.position.x = Math.sin(time * 3 - i * 0.5) * 0.3; });

  // attacchi
  fireCd -= dt;
  const aim = V(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  if (firing && form === 'dragon') breathe(dt, aim);
  else if (firing && fireCd <= 0) {
    if (form === 'beast') { zap(aim); fireCd = 0.3; }
    else if (form === 'serpent') { tornado(); fireCd = 0.45; }
    else if (form === 'mage') { mageCast(); fireCd = [0.5, 1.2, 2, 0.5][tech]; }
    else if (WEAPONS[cur].use) { if (!useK) startUse(); fireCd = 0.3; }
    else if (WEAPONS[cur].magic === 'energia') { /* si carica tenendo premuto: vedi updateCharge */ }
    else if (WEAPONS[cur].magic) { if (magicCd <= 0) castMagic(cur); fireCd = 0.2; }
    else { shoot(); fireCd = WEAPONS[cur].rate; }
  }
  updateUse(dt); updateCharge(dt); updateFx(dt); updateDomain(dt);
  mage.userData.crown.rotation.y += dt * 2;
  magicCd = Math.max(0, magicCd - dt); shake = Math.max(0, shake - dt);
  if ((dmgT -= dt) <= 0) $('dmgnum').style.opacity = 0;
  updateTornadoes(dt); updateBars(dt);
  if (skyDome) skyDome.position.set(P.x, 0, P.z);

  // boss
  const prog = clamp(-P.z / LEN, 0, 1);
  if (!boss && P.z < -LEN + 35) { // all'ingresso della radura, così la si vede bene
    boss = makeBoss(); boss.position.set(0, 0, -LEN + 6); scene.add(boss); enemies.push(boss);
    $('boss').style.display = 'block'; SFX.roar(); toast(`⚠️ ARRIVA ${CFG.boss}! ⚠️`);
  }
  if (boss && !bossDead) ui('bossbar', 'width', Math.max(0, boss.userData.hp / boss.userData.max * 100).toFixed(1) + '%');

  // nemici
  spawnT -= dt;
  if (spawnT <= 0 && enemies.length < 6 + prog * 14 + LV * 4) {
    spawnT = rnd(0.5, 1.4);
    const e = makeEnemy(Math.random() < 0.08 + prog * 0.2 + LV * 0.05), a = rnd(-1.3, 1.3), d = rnd(30, 55);
    e.position.set(clamp(P.x + Math.sin(a) * d, -W, W), 0, Math.max(P.z - Math.cos(a) * d, -LEN - 20));
    scene.add(e); enemies.push(e);
  }
  for (const e of [...enemies]) {
    const u = e.userData; u.t += dt; u.cd -= dt;
    if (u.stun > 0) { u.stun -= dt; continue; } // immobile durante il Dominio Stellare
    const dx = P.x - e.position.x, dz = P.z - e.position.z, d = Math.hypot(dx, dz);
    if (d > 110 && !u.boss) { scene.remove(e); enemies.splice(enemies.indexOf(e), 1); continue; }
    // ti vedono solo entro AGGRO metri (o se li colpisci); ti perdono oltre LOSE
    if (!u.aggro && (d < AGGRO || u.boss)) { u.aggro = true; if (!u.boss) burst(e.position.clone().setY(2.5 * e.scale.y), 0xffdd33, 4, 2); }
    if (u.aggro && d > LOSE && !u.boss) u.aggro = false;
    if (u.rooted > 0) u.rooted -= dt; // bloccato dalla magia della terra
    else if (!u.aggro) { // vaga senza sapere dove sei
      if ((u.wT = (u.wT || 0) - dt) <= 0) { u.wT = rnd(2, 5); u.wA = rnd(0, Math.PI * 2); u.wS = Math.random() < 0.4 ? 0 : u.speed * 0.3; }
      if (u.wS) { const mx = Math.sin(u.wA), mz = Math.cos(u.wA); e.position.x += mx * u.wS * dt; e.position.z += mz * u.wS * dt; e.rotation.y = Math.atan2(-mx, -mz); collide(e.position, u.rad * 0.6); }
    } else {
    e.rotation.y = Math.atan2(-dx, -dz);
    if (d > u.rad + (form === 'man' ? 0.5 : 1.2)) {
      e.position.x += dx / d * u.speed * dt; e.position.z += dz / d * u.speed * dt;
      if (!u.boss) collide(e.position, u.rad * 0.6);
    } else if (u.cd <= 0 && P.y < (u.boss ? 10 : 2)) { u.cd = 1; hurt(u.dmg); }
    }
    if (u.boss && (u.shotCd -= dt) <= 0) {
      const rage = u.hp < u.max / 2; // sotto metà vita spara più spesso e più colpi
      u.shotCd = (rage ? 1.2 : 1.8) / Math.sqrt(CFG.mul); SFX.spit();
      const from = e.position.clone().setY(9), dir0 = P.clone().setY(P.y + 1).sub(from).normalize();
      for (let k = -3; k <= 3; k++) {
        const m = mesh(partG, B(rage ? 0xff4422 : CFG.spit), from.x, from.y, from.z); m.scale.setScalar(0.5); scene.add(m);
        shots.push({ m, vel: dir0.clone().applyAxisAngle(V(0, 1, 0), k * 0.13).multiplyScalar(rage ? 26 : 22), life: 4 });
      }
    }
    if (u.boss && (u.summonCd -= dt) <= 0) { // evoca rinforzi
      u.summonCd = 8;
      for (let k = 0; k < 3 + LV; k++) {
        const m = makeEnemy(k === 0); m.position.set(e.position.x + rnd(-8, 8), 0, e.position.z + rnd(2, 8));
        scene.add(m); enemies.push(m);
      }
    }
    e.position.y = u.fly ? 0.8 + Math.sin(u.t * 3) * 0.6 : Math.abs(Math.sin(u.t * (u.boss ? 3 : 8))) * 0.15;
    if (u.wings) { const f = Math.sin(u.t * 10) * 0.5; u.wings[0].rotation.z = f; u.wings[1].rotation.z = -f; }
    if (u.legs) { const s = Math.sin(u.t * 8) * 0.5; u.legs[0].rotation.x = s; u.legs[1].rotation.x = -s; }
    u.flash -= dt; u.mat.emissive.setHex(u.flash > 0 ? 0xaaaaaa : u.glow || 0);
  }
  for (const s of [...shots]) {
    s.m.position.addScaledVector(s.vel, dt);
    const hit = s.m.position.distanceTo(P.clone().setY(P.y + 1)) < (form === 'man' ? 1.3 : 2.2);
    if (hit) hurt(15);
    if (hit || (s.life -= dt) <= 0 || s.m.position.y < 0) { scene.remove(s.m); s.m.material.dispose(); shots.splice(shots.indexOf(s), 1); }
  }

  // oggetti
  for (const it of [...items]) {
    it.o.rotation.y += dt * 2; it.o.position.y = 1 + Math.sin(time * 3) * 0.2;
    if (flat(it.o) > 2) continue;
    // consumabili: non si raccolgono se non c'è posto (come le armi, ma senza scambiare quella in mano)
    if (it.type !== 'gun' && it.type !== 'power' && !canTake(it.data)) continue;
    scene.remove(it.o); items.splice(items.indexOf(it), 1);
    if (it.type !== 'power') give(it.data, it.n);

  }
  if (form === 'dragon' && Math.random() < 0.3) particle(dragon.userData.flame.getWorldPosition(V()), V(0, 2, 0), 0xff9922, 0.3, 0.12);
  if (form === 'beast' && Math.random() < 0.3) particle(P.clone().add(V(rnd(-1, 1), rnd(1, 2.5), rnd(-1, 1))), V(0, 1, 0), 0x99ffff, 0.2, 0.08);

  // effetti
  for (const l of [...lines]) if ((l.life -= dt) <= 0) { scene.remove(l.o); l.o.geometry.dispose(); l.o.material.dispose(); lines.splice(lines.indexOf(l), 1); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.m); partPool.push(p.m); parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.m.position.addScaledVector(p.vel, dt);

  }

  // HUD (ui() tocca la pagina solo se il valore è cambiato)
  const near = crates.find(c => flat(c) < 2.8);
  ui('hint', 'text', near ? `${isTouch ? 'Tocca APRI' : 'Premi E'} per aprire la cassa${near.userData.magic ? ' MAGICA ✨' : ''}` : '');
  ui('hpbar', 'width', clamp(Math.round(hp), 0, 100) + '%');
  ui('shbar', 'width', clamp(Math.round(shield), 0, 100) + '%');
  ui('stbar', 'width', Math.round(stamina) + '%'); ui('stbar', 'class', tired ? 'tired' : '');
  drawSlots();
  ui('weapon', 'html', form === 'dragon' ? '🔥 Fuoco' : form === 'beast' ? '⚡ Fulmini' : form === 'serpent' ? '🌪️ Tornado' : form === 'mage' ? `🔮 ${TECHS[tech]}${tech === 3 && domainUsed ? ' (usato)' : ''}` : `<span style="color:${RARITY[WEAPONS[cur].rar]}">${WEAPONS[cur].name}</span><br>${ammo[cur] === Infinity ? '∞' : (WEAPONS[cur].use ? 'x' : '') + ammo[cur]}`);
  ui('info', 'text', `Liv ${LV + 1} · ${CFG.foes}: ${kills}${LV === CITY ? '/' + ORC_GOAL : ''} · Casse: ${opened}`);
  ui('progbar', 'width', (prog * 100).toFixed(1) + '%');
  ui('form', 'text', form === 'man' ? '' : `${FORMS[form].name} ${Math.ceil(formT)}s`);
  const fc = form === 'man' ? '#fff' : FORMS[form].color; ui('form', 'color', fc); ui('cross', 'borderColor', fc);
  if ((msgT -= dt) <= 0) $('msg').textContent = '';
  if (bossDead && P.z < -LEN) end(true);
}

function updateCamera() {
  const fwd = V(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = V(Math.cos(yaw), 0, -Math.sin(yaw));
  const [h, dist, side] = form === 'dragon' ? [4, 8, 0] : form === 'beast' ? [3, 6, 0] : form === 'serpent' ? [5, 12, 0] : form === 'mage' ? [2.6, 5.5, 0.9] : [2, 4.5, 0.9];
  const target = P.clone().add(V(0, h, 0)).addScaledVector(right, side);
  // avvicina la telecamera se finirebbe dentro un palazzo o un albero
  const near = trees.filter(t => t.h && Math.hypot(t.x - P.x, t.z - P.z) < dist + t.r + 2);
  for (let d = dist; d >= 1; d -= 0.5) {
    camera.position.copy(target).addScaledVector(fwd, -d);
    const c = camera.position;
    if (!near.some(t => t.h > c.y && Math.hypot(c.x - t.x, c.z - t.z) < t.r * 1.2 + 0.3)) break;
  }
  camera.position.y = Math.max(camera.position.y, 0.4);
  camera.lookAt(target.add(fwd));
  if (shake > 0) camera.position.add(V(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(shake * 0.6));
}

const uiCache = {};
function ui(id, key, v) {
  if (uiCache[id + key] === v) return;
  uiCache[id + key] = v;
  const el = $(id);
  if (key === 'text') el.textContent = v; else if (key === 'html') el.innerHTML = v; else if (key === 'class') el.className = v; else el.style[key] = v;
}
// 5. qualità automatica: se per 2 secondi si va sotto i 40 fps, abbassa la risoluzione (fino a 0,6)
let fpsTime = 0, fpsFrames = 0, quality = renderer.getPixelRatio();
function loop() {
  requestAnimationFrame(loop);
  fit();
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05);
  if (state === 'play') {
    fpsTime += raw; fpsFrames++;
    if (fpsTime > 2) {
      if (fpsFrames / fpsTime < 40 && quality > 0.6) { quality = Math.max(0.6, quality - 0.2); renderer.setPixelRatio(quality); }
      fpsTime = fpsFrames = 0;
    }
    update(dt);
  }
  updateCamera();
  renderer.render(scene, camera);
}
loop();
window.gameReady = true;
</script>
</body>
